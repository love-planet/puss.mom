<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>18+ | Access</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
      padding: 16px;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: 
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)),
        url('https://i.postimg.cc/6qKRqYFp/photo-2026-10-30-21-14-09.jpg') center/cover no-repeat;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 20px 16px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: none;
    }

    @media (min-width: 480px) {
      .card {
        padding: 24px 20px;
      }
    }

    .lang-switch {
      position: absolute;
      top: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      color: #eee;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      z-index: 5;
      backdrop-filter: blur(6px);
    }

    .lang-switch:hover {
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
    }

    .icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 22px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    @media (min-width: 480px) {
      h1 { font-size: 23px; }
    }

    p {
      color: #f0f0f0;
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 28px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 400px) {
      .buttons {
        flex-direction: row;
      }
    }

    button {
      flex: 1;
      padding: 15px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      min-height: 48px;
    }

    .btn-yes {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.4s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.35);
    }

    .btn-yes.active {
      opacity: 1;
      pointer-events: auto;
    }

    .btn-yes.active:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.5);
    }

    .btn-no {
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
    }

    .btn-no:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    .denied {
      display: none;
      color: #f87171;
      font-size: 15px;
      margin-top: 18px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    .hp {
      position: absolute;
      left: -9999px;
      opacity: 0;
      height: 0;
      width: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <div class="lang-switch" id="langBtn" onclick="toggleLang()">EN</div>

    <div class="icon">18+</div>

    <h1 id="title">Подтверждение возраста</h1>
    <p id="desc">Этот контент предназначен только для лиц старше 18 лет. Вам уже исполнилось 18?</p>

    <input type="text" class="hp" id="hp" name="website" tabindex="-1" autocomplete="off">

    <div class="buttons">
      <button class="btn-yes" id="yesBtn" onclick="enter()">Да, мне 18+</button>
      <button class="btn-no" id="noBtn" onclick="deny()">Нет</button>
    </div>

    <div class="denied" id="denied">Доступ запрещён</div>
  </div>

  <script>
    // ←←← ВСТАВЬ СВОЮ ССЫЛКУ СЮДА ↓
    const REDIRECT_URL = "https://sunati.top/search?key=qenbg-np8ax&sub_id1=puss";
    // ←←←↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑

    const texts = {
      ru: {
        title: "Подтверждение возраста",
        desc: "Этот контент предназначен только для лиц старше 18 лет. Вам уже исполнилось 18?",
        yes: "Да, мне 18+",
        no: "Нет",
        denied: "Доступ запрещён",
        lang: "EN"
      },
      en: {
        title: "Age Verification",
        desc: "This content is intended only for persons over 18 years of age. Are you 18 or older?",
        yes: "Yes, I'm 18+",
        no: "No",
        denied: "Access denied",
        lang: "RU"
      }
    };

    let currentLang = localStorage.getItem('lang') || (navigator.language.startsWith('ru') ? 'ru' : 'en');
    let humanDetected = false;
    let pageLoadTime = Date.now();

    function applyLang() {
      const t = texts[currentLang];
      document.getElementById('title').textContent = t.title;
      document.getElementById('desc').textContent = t.desc;
      document.getElementById('yesBtn').textContent = t.yes;
      document.getElementById('noBtn').textContent = t.no;
      document.getElementById('denied').textContent = t.denied;
      document.getElementById('langBtn').textContent = t.lang;
      document.documentElement.lang = currentLang;
    }

    function toggleLang() {
      currentLang = currentLang === 'ru' ? 'en' : 'ru';
      localStorage.setItem('lang', currentLang);
      applyLang();
    }

    function activateButton() {
      if (humanDetected) return;
      humanDetected = true;
      document.getElementById('yesBtn').classList.add('active');
    }

    ['mousemove', 'touchstart', 'scroll', 'keydown'].forEach(evt => {
      window.addEventListener(evt, activateButton, { once: true, passive: true });
    });

    setTimeout(() => {
      document.getElementById('yesBtn').classList.add('active');
    }, 2500);

    function enter() {
      const hp = document.getElementById('hp').value;
      if (hp) return;

      const timeOnPage = Date.now() - pageLoadTime;
      if (timeOnPage < 800) return;

      if (!document.getElementById('yesBtn').classList.contains('active')) return;

      window.location.href = REDIRECT_URL;
    }

    function deny() {
      document.querySelector('.buttons').style.display = 'none';
      document.getElementById('denied').style.display = 'block';
    }

    applyLang();
  </script>
</body>
</html>
